name: Fetch Brahmi font

# Run once from the Actions tab. Downloads Noto Sans Brahmi (SIL Open Font License)
# and commits it, because F-Droid builds only from what is in the repository.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/fetch-font.sh
      - name: Commit the font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fonts
          git diff --cached --quiet && { echo "Font already committed"; exit 0; }
          git commit -m "Add Noto Sans Brahmi font (SIL OFL)"
          git push
