name: Release

# Runs when you push a tag like v0.9.0. Builds the signed bundle for Google Play and a signed APK,
# and attaches both to a GitHub release. Needs the four signing secrets (see docs/PUBLISHING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Tag matches versionName
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match versionName $V in build.gradle.kts"; exit 1; }
      - name: Font is committed
        run: test -f data/fonts/NotoSansBrahmi-Regular.ttf || { echo "::error::Run the 'Fetch Brahmi font' workflow first"; exit 1; }
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret KEYSTORE_BASE64 is missing (see docs/PUBLISHING.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Tests
        working-directory: android
        run: gradle :app:testPlayDebugUnitTest --no-daemon
      - name: Build bundle and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundlePlayRelease :app:assemblePlayRelease --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "brahmi-keyboard-$GITHUB_REF_NAME.aab"
          cp android/app/build/outputs/apk/play/release/app-play-release.apk "brahmi-keyboard-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "brahmi-keyboard-$GITHUB_REF_NAME.aab" "brahmi-keyboard-$GITHUB_REF_NAME.apk" \
            --title "Brahmi Keyboard $GITHUB_REF_NAME" --notes-file fastlane/metadata/android/en-US/changelogs/$(grep -oP 'versionCode = \K[0-9]+' android/app/build.gradle.kts).txt
